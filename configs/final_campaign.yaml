# Final training campaign: protocol frozen from the one-seed pilot (seed 0, docs/decisions.md, 31 oct 2026).
# Seeds exclude the pilot seed. Data split (seed 2026) and canaries are fixed across seeds.
rounds: 4
lr: 2.0e-4
micro_batch: 4
logical_batch: 32
clamp_bound: 0.02          # B_inf of every scheme, N included (matched encoding)
clip: 4.0                  # DP clipping norm
delta: 1.0e-5
seeds: [1, 2, 3, 4, 5]
dp_levels: {none: null, eps8: 8.0, eps2: 2.0}
configs:                   # scheme x DP level; Z is the non-private centralized reference
  - {scheme: N, levels: [none, eps8, eps2]}
  - {scheme: A, levels: [none, eps8, eps2]}
  - {scheme: C, levels: [none, eps8, eps2]}
  - {scheme: B, levels: [none, eps8, eps2]}
  - {scheme: B-BGV, levels: [none, eps8, eps2]}
  - {scheme: Z, levels: [none]}
